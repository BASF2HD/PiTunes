name: Feature request
description: Suggest a focused PiTunes improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Describe the problem or workflow this should improve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected behavior without prescribing implementation details.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Playback
        - Library and artwork
        - CoverFlow UI
        - Network and storage
        - AirPlay or Bluetooth
        - Installation or updates
        - Documentation
        - Other
    validations:
      required: true
