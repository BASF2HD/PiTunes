name: Build flashable image

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Raspberry Pi OS base architecture
        required: true
        default: armhf
        type: choice
        options:
          - armhf
          - arm64
      kiosk:
        description: Include HDMI Chromium kiosk
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-user-static binfmt-support kpartx rsync wget xz-utils \
            parted dosfstools e2fsprogs
          sudo wget -qO /usr/local/sbin/pishrink.sh \
            https://raw.githubusercontent.com/Drewsif/PiShrink/master/pishrink.sh
          sudo chmod +x /usr/local/sbin/pishrink.sh

      - name: Build EchoFlow image
        run: |
          chmod +x install.sh configure-mpd.sh scripts/*.sh
          ARGS=(--arch "${{ github.event.inputs.arch }}" --output "image/out/echoflow-${{ github.event.inputs.arch }}.img")
          if [ "${{ github.event.inputs.kiosk }}" = "true" ]; then
            ARGS+=(--kiosk)
          else
            ARGS+=(--no-kiosk)
          fi
          sudo ./scripts/build-flashable-image.sh "${ARGS[@]}"
          cd image/out
          sha256sum ./*.img.xz > SHA256SUMS

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: echoflow-${{ github.event.inputs.arch }}-img
          path: |
            image/out/*.img.xz
            image/out/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
