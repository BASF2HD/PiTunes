[global]
   workgroup = WORKGROUP
   netbios name = ECHOFLOW
   server string = EchoFlow Music
   security = user
   map to guest = Bad User
   dns proxy = no
   load printers = no
   printing = bsd
   disable spoolss = yes
   server min protocol = SMB2

[Music]
   comment = EchoFlow music library
   path = /mnt/music
   browseable = yes
   read only = no
   guest ok = yes
   force user = mpd
   force group = audio
   create mask = 0664
   directory mask = 0775
   vfs objects = catia fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
