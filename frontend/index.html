<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>EchoFlow</title>
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main id="app">
    <header class="top-hud" aria-label="Playback overview">
      <div id="top-time">0:00 / --:--</div>
      <input id="top-seek" type="range" min="0" max="100" value="0" aria-label="Seek">
      <button id="search-toggle" class="circle-button" type="button" aria-label="Search" title="Search">
        <svg viewBox="0 0 24 24"><path d="M10.7 4a6.7 6.7 0 0 1 5.3 10.8l4.1 4.1-1.4 1.4-4.1-4.1A6.7 6.7 0 1 1 10.7 4Zm0 2a4.7 4.7 0 1 0 0 9.4 4.7 4.7 0 0 0 0-9.4Z"/></svg>
      </button>
      <button id="fullscreen-button" class="circle-button" type="button" aria-label="Fullscreen" title="Fullscreen">
        <svg viewBox="0 0 24 24"><path d="M4 4h6v2H7.4l4.1 4.1-1.4 1.4L6 7.4V10H4zm10 0h6v6h-2V7.4l-4.1 4.1-1.4-1.4L16.6 6H14zM4 14h2v2.6l4.1-4.1 1.4 1.4L7.4 18H10v2H4zm14 0h2v6h-6v-2h2.6l-4.1-4.1 1.4-1.4 4.1 4.1z"/></svg>
      </button>
      <button id="mute-button" class="circle-button" type="button" aria-label="Volume" title="Volume">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9zm14.5 3A5.5 5.5 0 0 0 14 6.9v2.2a3.5 3.5 0 0 1 0 5.8v2.2a5.5 5.5 0 0 0 3.5-5.1Z"/></svg>
      </button>
      <input id="search-input" type="search" placeholder="Search albums" autocomplete="off">
    </header>

    <section id="coverflow" aria-label="CoverFlow album browser"></section>

    <section class="album-title-panel" aria-live="polite">
      <h1 id="album-title">Loading</h1>
      <button id="album-menu-button" class="vertical-button" type="button" aria-label="Album menu">...</button>
    </section>

    <footer class="dock">
      <div class="dock-transport">
        <button id="previous-button" class="flat-button" type="button" aria-label="Previous">
          <svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zm12 0v14l-9-7z"/></svg>
        </button>
        <button id="play-button" class="play-button" type="button" aria-label="Play or pause">
          <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button id="next-button" class="flat-button" type="button" aria-label="Next">
          <svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM6 5v14l9-7z"/></svg>
        </button>
        <div class="mini-seek">
          <button class="scrub-end" id="seek-back" type="button" aria-label="Seek backward"></button>
          <input id="seek-input" type="range" min="0" max="100" value="0" aria-label="Seek">
          <button class="scrub-end" id="seek-forward" type="button" aria-label="Seek forward"></button>
        </div>
        <button id="track-list-button" class="flat-button" type="button" aria-label="Track list">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v2H4zm0 4h16v2H4zm0 4h16v2H4z"/></svg>
        </button>
      </div>
      <nav class="dock-nav" aria-label="Main sections">
        <button class="dock-tab active" data-view="albums" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm0 5a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
          <span>Album</span>
        </button>
        <button class="dock-tab" data-view="songs" type="button">
          <svg viewBox="0 0 24 24"><path d="M14 4v11.5A3.5 3.5 0 1 1 12 12V6h8V4z"/></svg>
          <span>Songs</span>
        </button>
        <button class="dock-tab" data-view="artists" type="button">
          <svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0z"/></svg>
          <span>Artist</span>
        </button>
        <button class="dock-tab" data-view="playlist" type="button">
          <svg viewBox="0 0 24 24"><path d="M4 7h10v2H4zm0 4h10v2H4zm0 4h7v2H4zm13-8h2v8h3l-4 4-4-4h3z"/></svg>
          <span>Playlist</span>
        </button>
        <button class="dock-tab" data-view="more" type="button">
          <svg viewBox="0 0 24 24"><path d="M6 10a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Zm6 0a2 2 0 1 1 0 4 2 2 0 0 1 0-4Z"/></svg>
          <span>More</span>
        </button>
        <button id="settings-button" class="dock-tab" data-view="settings" type="button">
          <svg viewBox="0 0 24 24"><path d="M19.4 13.5c.1-.5.1-1 .1-1.5s0-1-.1-1.5l2-1.5-2-3.4-2.4 1a8 8 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.6A8 8 0 0 0 7 6.6l-2.4-1-2 3.4 2 1.5a10 10 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a8 8 0 0 0 2.6 1.5l.4 2.6h4l.4-2.6a8 8 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.5ZM12 15.5A3.5 3.5 0 1 1 12 8a3.5 3.5 0 0 1 0 7.5Z"/></svg>
          <span>Settings</span>
        </button>
      </nav>
    </footer>
  </main>

  <aside id="tracks-drawer" class="drawer" aria-hidden="true">
    <div class="drawer-header">
      <div>
        <div class="eyebrow">Album</div>
        <h2 id="drawer-title">Tracks</h2>
        <p id="drawer-subtitle"></p>
      </div>
      <button id="drawer-close" class="circle-button" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4zm12.6 1.4L6.4 19 5 17.6 17.6 5z"/></svg>
      </button>
    </div>
    <div class="drawer-actions">
      <button id="play-album-button" type="button">Play Album</button>
    </div>
    <div id="track-list" class="track-list"></div>
  </aside>

  <section id="settings-panel" class="settings-panel" aria-hidden="true">
    <div class="settings-card">
      <div class="drawer-header">
        <div>
          <div class="eyebrow">System</div>
          <h2>Settings</h2>
        </div>
        <button id="settings-close" class="circle-button" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4zm12.6 1.4L6.4 19 5 17.6 17.6 5z"/></svg>
        </button>
      </div>
      <form id="settings-form" class="settings-grid">
        <label>Music folder<input id="setting-music-path" name="music_directory" value="/mnt/music"></label>
        <label>Audio output<select id="audio-output-device" name="audio_output"></select></label>
        <label>Mixer type<select id="audio-output-mixer"><option value="software">Software volume</option><option value="none">Bit-perfect/no mixer</option><option value="hardware">Hardware mixer</option></select></label>
        <label>Animation speed<input id="setting-speed" type="range" min="0.06" max="0.4" step="0.01"></label>
        <label>Visible covers<input id="setting-visible" type="number" min="24" max="240" step="12"></label>
        <button id="save-settings-button" class="primary-button" type="submit">Save</button>
      </form>
      <div class="settings-actions">
        <button id="rescan-button" type="button">Rescan Library</button>
        <button id="rebuild-button" type="button">Rebuild Artwork</button>
        <button id="audio-refresh-button" type="button">Refresh Audio</button>
      </div>
      <pre id="settings-status"></pre>
    </div>
  </section>

  <script type="module" src="/assets/app.js"></script>
</body>
</html>
